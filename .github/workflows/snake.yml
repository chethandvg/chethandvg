name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours
  workflow_dispatch:

concurrency:
  group: generate-snake-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Allows the action to push to the output branch
    steps:
      - uses: actions/checkout@v7

      # Dot colours match contrib_ramp() in scripts/theme.py.
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: chethandvg
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#5B4BFF&color_dots=#EDEFF5,#ABA5FA,#5B4BFF,#2D7CD4,#0C859C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#3EC6E0&color_dots=#1A1F2C,#4D498B,#8B7CFF,#5DA8EC,#82DAEB

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          allow_empty_commit: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
