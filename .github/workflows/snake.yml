name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Dot colours follow the Aurora contribution scale used by the Profilescape
      # cards, so the snake matches the 3D graph: dim violet for quiet days,
      # bright cyan for the busiest ones.
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#5B4BFF&color_dots=#EDEFF5,#ABA5FA,#5B4BFF,#215A9A,#074C5A
            dist/snake-dark.svg?palette=github-dark&color_snake=#3EC6E0&color_dots=#1A1F2C,#4D498B,#8B7CFF,#5DA8EC,#82DAEB

      - name: Publish to the snake-output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: snake-output
          build_dir: dist
          commit_message: "chore: update contribution snake"
          allow_empty_commit: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
