<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Chethan D V — Software Engineer · Full-Stack · Applied AI">
<title>Chethan D V — Software Engineer · Full-Stack · Applied AI</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#3EC6E0"/></linearGradient>
  <radialGradient id="orbA"><stop offset="0" stop-color="#8B7CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop offset="0" stop-color="#3EC6E0" stop-opacity="0.55"/><stop offset="1" stop-color="#3EC6E0" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
  <radialGradient id="gridFade" cx="0.3" cy="0.35" r="0.85"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="400" fill="url(#gridFade)"/></mask>
  <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .orbA{animation:driftA 16s ease-in-out infinite alternate}
    .orbB{animation:driftB 19s ease-in-out infinite alternate}
    @keyframes driftA{to{transform:translate(140px,50px)}}
    @keyframes driftB{to{transform:translate(-160px,-40px)}}
    .up{animation:up .7s cubic-bezier(.2,.7,.2,1) backwards}
    @keyframes up{from{opacity:0;transform:translateY(10px)}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 6s ease-in-out infinite}
    @keyframes scan{0%,100%{opacity:.0}50%{opacity:.9}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="400" fill="#0B0D14"/>
  <rect width="1200" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle class="orbA" cx="180" cy="40" r="320" fill="url(#orbA)"/>
  <circle class="orbB" cx="1060" cy="380" r="340" fill="url(#orbB)"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#accent)"/>
</g>
<rect x=".5" y=".5" width="1199" height="399" rx="24" fill="none" stroke="#232838"/>

