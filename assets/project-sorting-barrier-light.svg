  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B4BFF"/><stop offset="1" stop-color="#0E9DB8"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#5B4BFF" stop-opacity="0.12600000000000003"/><stop offset="1" stop-color="#5B4BFF" stop-opacity="0"/></radialGradient>
