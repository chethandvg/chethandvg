<rect x="332" y="25" width="44" height="22" rx="11" fill="#F1F2F8" stroke="#E3E6EF"/>
<text x="354" y="40" text-anchor="middle" class="mono" font-size="11" fill="#525B70">SSSP</text>
<text x="24" y="72" class="sans" font-size="20" font-weight="700" letter-spacing="-.3" fill="#0F172A">Breaking the Sorting Barrier</text>
<text x="24" y="104" class="sans" font-size="13.5" fill="#525B70">First C# implementation of the STOC 2025 algorithm</text><text x="24" y="125" class="sans" font-size="13.5" fill="#525B70">that breaks Dijkstra&#x27;s 50-year sorting barrier.</text><text x="24" y="146" class="sans" font-size="13.5" fill="#525B70">49× fewer heap operations, 97 tests.</text>
